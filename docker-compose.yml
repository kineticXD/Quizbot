# Single-bot deployment: one BotFather token, one application process.
# The optional Mini App runs in the same process when MINI_APP_DOMAIN is set.
services:
  quizbot:
    build: .
    container_name: advance-quizbot
    command: ["python", "run.py"]
    env_file: .env
    restart: unless-stopped
    ports:
      - "${MINI_APP_PORT:-8080}:${MINI_APP_PORT:-8080}"
